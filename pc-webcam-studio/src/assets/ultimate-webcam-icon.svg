<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Canvas Container -->
    <radialGradient id="bgD" cx="50%" cy="28%" r="85%">
      <stop offset="0%" stop-color="#182216" />
      <stop offset="50%" stop-color="#0e130c" />
      <stop offset="100%" stop-color="#060805" />
    </radialGradient>

    <!-- App Squircle Border Highlight -->
    <linearGradient id="sqBorderD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff2c" />
      <stop offset="35%" stop-color="#c6f36b48" />
      <stop offset="70%" stop-color="#ffffff08" />
      <stop offset="100%" stop-color="#c6f36b15" />
    </linearGradient>

    <!-- Hero U: Rich Vibrant Chartreuse-Lime Satin Gradient -->
    <linearGradient id="uLimeGradD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eeffa6" />
      <stop offset="30%" stop-color="#c6f36b" />
      <stop offset="70%" stop-color="#9fe634" />
      <stop offset="100%" stop-color="#72b51b" />
    </linearGradient>

    <!-- Polished Bevel Stroke for U (Catching light from top-left) -->
    <linearGradient id="uBevelStrokeD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="25%" stop-color="#f2ffcf" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#558019" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.2" />
    </linearGradient>

    <!-- Inner Shadow / Depth Groove on U -->
    <linearGradient id="uInnerDepth" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3d6110" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Outer Lens Chassis Bezel -->
    <linearGradient id="lensBezelD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#283324" />
      <stop offset="35%" stop-color="#182015" />
      <stop offset="75%" stop-color="#0d120c" />
      <stop offset="100%" stop-color="#1c2419" />
    </linearGradient>

    <!-- Optical Glass Depth Gradient -->
    <radialGradient id="lensGlassD" cx="36%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#1e463a" />
      <stop offset="35%" stop-color="#0d2520" />
      <stop offset="75%" stop-color="#051410" />
      <stop offset="100%" stop-color="#010605" />
    </radialGradient>

    <!-- Central Aperture Core -->
    <radialGradient id="sensorPupilD" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#020402" />
      <stop offset="80%" stop-color="#000000" />
      <stop offset="100%" stop-color="#080c07" />
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="uShadowD" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.85" />
      <feDropShadow dx="0" dy="4" stdDeviation="14" flood-color="#c6f36b" flood-opacity="0.28" />
    </filter>

    <filter id="lensShadowD" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <filter id="glowD" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- ========================================== -->
  <!-- APP SQUIRCLE CANVAS CONTAINER              -->
  <!-- ========================================== -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgD)" stroke="url(#sqBorderD)" stroke-width="2.5" />

  <!-- Studio Alignment Geometry / Optical Reticle in Background -->
  <g opacity="0.06" stroke="#c6f36b" stroke-width="1.2">
    <circle cx="256" cy="254" r="164" fill="none" stroke-dasharray="4 8" />
    <circle cx="256" cy="254" r="212" fill="none" />
    <line x1="256" y1="64" x2="256" y2="88" />
    <line x1="256" y1="424" x2="256" y2="448" />
    <line x1="64" y1="254" x2="88" y2="254" />
    <line x1="424" y1="254" x2="448" y2="254" />
  </g>

  <!-- ========================================== -->
  <!-- HERO "U" GLYPH                             -->
  <!-- ========================================== -->
  <g filter="url(#uShadowD)">
    <!-- Base U Silhouette:
         Outer bounds: X: 84 to 428 (width: 344)
         Stem width: 76px
         Top terminals: smoothly filleted with subtle 45-deg optical bevel
         Base curve: center (256, 254), outer radius: 172, inner radius: 96
    -->
    <path d="
      M 84,118
      C 84,98 98,84 118,84
      L 142,84
      C 152,84 160,92 160,102
      L 160,254
      A 96,96 0 0,0 352,254
      L 352,102
      C 352,92 360,84 370,84
      L 394,84
      C 414,84 428,98 428,118
      L 428,254
      A 172,172 0 0,1 84,254
      Z
    "
    fill="url(#uLimeGradD)"
    stroke="#090d08"
    stroke-width="5"
    stroke-linejoin="round"
    />

    <!-- Polished Bevel Contour (Continuous inner-stroke highlight) -->
    <path d="
      M 89,120
      C 89,103 100,90 118,90
      L 140,90
      C 148,90 155,96 155,105
      L 155,254
      A 101,101 0 0,0 357,254
      L 357,105
      C 357,96 364,90 372,90
      L 394,90
      C 412,90 423,103 423,120
      L 423,254
      A 167,167 0 0,1 89,254
      Z
    "
    fill="none"
    stroke="url(#uBevelStrokeD)"
    stroke-width="2.5"
    />

    <!-- Inner Bottom Depth Shade (Enhances the 3D curvature of the U) -->
    <path d="
      M 86,254
      A 170,170 0 0,0 426,254
      A 164,164 0 0,1 92,254
      Z
    "
    fill="url(#uInnerDepth)"
    />

    <!-- Precision Studio Engravings / Caliber Markings on Stem Flanks -->
    <g stroke="#090d08" stroke-width="3" stroke-linecap="round" opacity="0.9">
      <line x1="72" y1="150" x2="82" y2="150" />
      <line x1="72" y1="174" x2="82" y2="174" />
      <line x1="72" y1="198" x2="82" y2="198" />

      <line x1="430" y1="150" x2="440" y2="150" />
      <line x1="430" y1="174" x2="440" y2="174" />
      <line x1="430" y1="198" x2="440" y2="198" />
    </g>
  </g>

  <!-- ========================================== -->
  <!-- MASTERPIECE WEBCAM OPTICAL LENS (CENTERED) -->
  <!-- Centered inside the U at (256, 254)        -->
  <!-- ========================================== -->
  <g id="cameraLensD" filter="url(#lensShadowD)">
    <!-- Outer Heavy Chassis Bezel (Dark Titanium) -->
    <circle cx="256" cy="254" r="82" fill="url(#lensBezelD)" stroke="#090d08" stroke-width="4.5" />
    
    <!-- Polished Bezel Highlight Rim -->
    <circle cx="256" cy="254" r="79" fill="none" stroke="#ffffff35" stroke-width="1.8" />

    <!-- Focus / Zoom Caliber Ring -->
    <circle cx="256" cy="254" r="72" fill="#121811" stroke="#ffffff12" stroke-width="1.2" />

    <!-- 12 Precision Optical Caliber Ticks in Neon Lime -->
    <g stroke="#c6f36b" stroke-width="2" stroke-linecap="round" opacity="0.9">
      <line x1="256" y1="186" x2="256" y2="194" />
      <line x1="256" y1="314" x2="256" y2="322" />
      <line x1="188" y1="254" x2="196" y2="254" />
      <line x1="316" y1="254" x2="324" y2="254" />
      <!-- 45-deg ticks -->
      <line x1="208" y1="206" x2="214" y2="212" />
      <line x1="298" y1="296" x2="304" y2="302" />
      <line x1="208" y1="302" x2="214" y2="296" />
      <line x1="298" y1="212" x2="304" y2="206" />
    </g>

    <!-- Deep Multi-Coated Optical Glass Element -->
    <circle cx="256" cy="254" r="60" fill="url(#lensGlassD)" stroke="#1a2518" stroke-width="2.5" />

    <!-- Realistic Anti-Reflective Optical Glass Flares (Cyan & Electric Lime) -->
    <!-- Primary Top-Left Crescent Flare -->
    <path d="M 214,222 A 50,50 0 0,1 282,208 A 46,46 0 0,0 220,238 Z" fill="#4ef2d2" opacity="0.55" />
    <path d="M 210,232 A 52,52 0 0,1 254,206 A 48,48 0 0,0 216,244 Z" fill="#c6f36b" opacity="0.7" />

    <!-- Secondary Bottom-Right Subtle Reflection -->
    <path d="M 296,278 A 50,50 0 0,1 250,300 A 48,48 0 0,0 290,266 Z" fill="#c6f36b" opacity="0.32" />

    <!-- 6-Blade Mechanical Aperture Iris Structure -->
    <circle cx="256" cy="254" r="38" fill="#090e08" stroke="#ffffff15" stroke-width="1.2" />
    
    <!-- Precision Aperture Blades (Interlocking Geometric Iris) -->
    <g stroke="#c6f36b66" stroke-width="1.2" fill="#050804">
      <path d="M 256,222 L 282,237 L 274,250 L 248,235 Z" />
      <path d="M 282,237 L 282,267 L 268,267 L 268,237 Z" />
      <path d="M 282,267 L 256,282 L 248,269 L 274,254 Z" />
      <path d="M 256,282 L 230,267 L 238,254 L 264,269 Z" />
      <path d="M 230,267 L 230,237 L 244,237 L 244,267 Z" />
      <path d="M 230,237 L 256,222 L 264,235 L 238,250 Z" />
    </g>

    <!-- Center Sensor Cavity & Central Pupil -->
    <circle cx="256" cy="254" r="18" fill="url(#sensorPupilD)" stroke="#ffffff25" stroke-width="1" />
    <circle cx="256" cy="254" r="10" fill="#000000" />

    <!-- Specular Highlight Dots (Pinpoint Optical Glints) -->
    <circle cx="250" cy="248" r="3.6" fill="#ffffff" opacity="0.95" />
    <circle cx="254.5" cy="252.5" r="1.8" fill="#c6f36b" opacity="0.85" />
  </g>

  <!-- LIVE STUDIO BROADCAST TALLY INDICATOR -->
  <!-- Precision jewel LED resting directly atop the lens collar -->
  <g filter="url(#glowD)">
    <circle cx="256" cy="170" r="7.5" fill="#090e08" stroke="#090d08" stroke-width="2.2" />
    <circle cx="256" cy="170" r="5" fill="#c6f36b" stroke="#ffffff" stroke-width="0.8" />
    <circle cx="254.2" cy="168.2" r="1.6" fill="#ffffff" />
  </g>
</svg>