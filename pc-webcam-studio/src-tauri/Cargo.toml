[package]
name = "pc-webcam-studio"
version = "1.3.2"
description = "Native Rust + Tauri v2 + WGPU USB Mobile Webcam Studio"
authors = ["Instant Webcam"]
license = "MIT"
edition = "2021"

[features]
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "pc_webcam_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon", "image-ico", "image-png"] }
tauri-plugin-shell = "2.0.0"
tauri-plugin-autostart = "2.0.0"
window-vibrancy = "0.5.2"
windows-registry = "0.6.1"

tokio = { version = "1.40.0", features = ["full"] }
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
log = "0.4"
anyhow = "1.0.89"
thiserror = "1.0.64"

# Graphics & Compute (DirectX 12 WGSL Shaders)
wgpu = "22.0.0"
pollster = "0.3.0"
bytemuck = { version = "1.18.0", features = ["derive"] }

# Low-Latency H.264 Decoding via Cisco OpenH264 (Self-Contained C++ Engine)
openh264 = "0.6.5"

# Low-Latency Audio Streaming (Windows WASAPI)
cpal = "0.15.3"

# Win32 APIs for UnityCapture / Softcam DirectShow Shared Memory
[target.'cfg(windows)'.dependencies.windows]
version = "0.58.0"
features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi"
]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
